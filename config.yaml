  # LM Studio (nomenclatura con ":" estilo ollama: lmstudio:<id>).
  # Los 2 del pool (gemelo de cada despliegue) + alias directo del
  # embedding Qwen (no sirve chat; meterlo al pool rompería el fallback).
  # ---------------------------------------------------------------------
  - model_name: lmstudio:lfm2.5-24b-a2b
    litellm_params:
      model: openai/lfm2.5-24b-a2b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: os.environ/LM_STUDIO_API_KEY

  - model_name: lmstudio:qwen3.5-4b
    litellm_params:
      model: openai/qwen3.5-4b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: os.environ/LM_STUDIO_API_KEY

  - model_name: lmstudio:text-embedding-qwen3-embedding-0.6b
    litellm_params:
      model: openai/text-embedding-qwen3-embedding-0.6b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: os.environ/LM_STUDIO_API_KEY
  # ---------------------------------------------------------------------

litellm_settings:
  # Descarta parámetros no soportados por el proveedor en vez de fallar
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # admin del proxy / login a la UI
  database_url: os.environ/DATABASE_URL       # Postgres para virtual keys + spend
  store_model_in_db: true                     # keys, usuarios y gasto en la BD
  # Los *modelos* se gestionan desde este fichero config.yaml
