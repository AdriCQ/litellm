# LiteLLM stack: gateway + Postgres (virtual keys, usuarios y spend logs).
#
# Los proveedores/modelos se configuran en ./config.yaml y las keys de los
# proveedores en ./.env — no en este fichero.
#
# Arranque:            docker compose up -d
# Test:                curl http://localhost:${LITELLM_PORT:-4000}/v1/models -H "Authorization: Bearer $(grep ^LITELLM_MASTER_KEY .env | cut -d= -f2)"
# Cambios del config:  docker compose exec litellm kill -USR2 1   # o: docker compose restart litellm
#
# Notas:
#   - Imagen pineada a release estable. `:latest` avanza sólo pero no es
#     reproducible; cambia el tag para actualizar.
#   - LITELLM_SALT_KEY (en .env) no se puede rotar una vez hay credenciales
#     cifradas en la BD.
services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:1.105.1
    ports:
      - "${LITELLM_PORT:-4000}:4000"   # puerto en el host configurable vía .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@db:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
    env_file:
      - .env        # master key, salt key y keys de proveedores
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
